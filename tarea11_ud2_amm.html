<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 11</title>
    <meta name="description" content="Esta es mi primera página web.">

</head>
<body>
    <h1>APLICATIVO PARA TRABAJAR EN AMAZON</h1>
    <form acction="" method="get">
        <fieldset>
            <legend><b>DATOS PERSONALES</b></legend>

            <br>

            <label for="nombre">NOMBRE:</label>
            <input type="text" name="nombre" id="nombre">
            <label for="apellido">APELLIDOS:</label>
            <input type="text" name="apellido" id="apellido">

            <br><br>

            <label for="telefono">TelfMóvil:</label>
            <input type="text" name="telefono" id="telefono">
            <label for="dni">DNI:</label>
            <input type="text" name="dni" id="dni">

            <br><br>

            <label for="calle">CALLE:</label>
            <input type="text" name="calle" id="calle">
            <label for="codigo">CÓDIGO POSTAL:</label>
            <input type="text" name="codigo" id="codigo">
            <label for="provincia">PROVINCIA</label>

            <select name="provincias" id="provincia">
                <option value="sevilla">Sevilla</option>
                <option value="cadiz">Cádiz</option>
            </select>

            <br><br>
        </fieldset>

        <br><br>

        <fieldset>
            <legend><b>EXPERIENCIA LABORAL</b></legend>

            <textarea name="descripcion" id="descripcion" cols="30" rows="10"></textarea>

            <br>

        </fieldset>
            <br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>

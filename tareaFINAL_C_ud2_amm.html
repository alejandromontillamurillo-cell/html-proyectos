<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea final C</title>
    <meta name="description" content="Esta es mi primera página web.">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="Montilla">
</head>
<body>

    <h1>Unordered lists</h1>

    <h4>Disc</h4>
    <ul style="list-style-type: disc;">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

    <h4>Square</h4>
    <ul style="list-style-type: square;">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

    <h4>Circle</h4>
    <ul style="list-style-type: circle;">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

    <h4>None - no bullets</h4>
    <ul style="list-style-type: none; padding-left: 20px;">
        <li>First item</li>
        <li>Second item</li>
        <li>Third item</li>
    </ul>

</body>
</html>
